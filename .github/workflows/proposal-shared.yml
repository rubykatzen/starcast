name: Proposal
on:
  workflow_call:
    inputs:
      regulations_repo:
        description: '"owner/repo" that owns the regulations document consulted by Propose, Distill, and Rework'
        required: true
        type: string
      regulations_path:
        description: 'Path to the regulations document inside regulations_repo'
        required: true
        type: string
      prefix:
        description: 'Prefix stripped from a proposal field name to find the same-named field on the parent issue'
        required: false
        type: string
        default: 'Proposal '
      proposal_type_name:
        description: 'Issue Type a proposal is created with'
        required: false
        type: string
        default: 'Proposal'
      issue_number:
        description: 'Number of the proposal issue; required for issue_comment-triggered runs, must be absent for schedule/workflow_dispatch runs'
        required: false
        type: string
      comment_id:
        description: 'Id of the triggering comment; required for issue_comment-triggered runs, must be absent for schedule/workflow_dispatch runs'
        required: false
        type: string
      telegram_chat_id:
        description: 'Telegram chat id to report triggered actions and outcomes to; omit to disable reporting (see #46)'
        required: false
        type: string
      capacity_query:
        description: 'GraphQL query text; must alias exactly one scalar numeric field as `capacity`. Required for schedule/workflow_dispatch runs (see #55)'
        required: false
        type: string
      queue_query:
        description: 'GraphQL query text; must alias exactly one array-valued field as `queue`, each element an issue-shaped object with at least `id`. Only the first element is used. Required for schedule/workflow_dispatch runs (see #55)'
        required: false
        type: string
      review_limit:
        description: 'Maximum number of issues allowed in review at once. Required for schedule/workflow_dispatch runs (see #55)'
        required: false
        type: number
      entity_query:
        description: 'GraphQL query text; must alias exactly one scalar field as `entity` (e.g. a ProjectV2Item id). Optional (see #69)'
        required: false
        type: string
      propose_transition_mutation:
        description: 'GraphQL mutation text run after a proposal is created, moving the controlling entity incoming -> review. Optional -- omit for no transition step (see #69)'
        required: false
        type: string
      apply_transition_mutation:
        description: 'GraphQL mutation text run after Apply succeeds, moving the controlling entity review -> done. Optional -- omit for no transition step (see #69)'
        required: false
        type: string
    secrets:
      token:
        description: 'Token with write access to issues, sub-issues, and Issue Fields on the parent and proposal repositories'
        required: true
      model_credentials:
        description: 'Credentials for the model invoked by Propose, Distill, and Rework'
        required: false
      telegram_bot_token:
        description: 'Telegram bot token used to send run reports; required if telegram_chat_id is set'
        required: false
permissions:
  issues: write
  contents: write
  pull-requests: write
# actions/proposal is pinned to @main below, not a version tag, while v0.9.0
# is still unreleased -- switch back to @v0.9 (matching route-issue-shared.yml's
# own pinned-tag pattern for its sibling action) once that tag exists.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Assert trigger context matches event type
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            if [ -z "${{ inputs.issue_number }}" ] || [ -z "${{ inputs.comment_id }}" ]; then
              echo "::error::issue_comment-triggered runs must receive issue_number and comment_id"
              exit 1
            fi
          else
            if [ -n "${{ inputs.issue_number }}" ] || [ -n "${{ inputs.comment_id }}" ]; then
              echo "::error::schedule/workflow_dispatch-triggered runs must not receive issue_number or comment_id"
              exit 1
            fi
            if [ -z "${{ inputs.capacity_query }}" ] || [ -z "${{ inputs.queue_query }}" ] || [ -z "${{ inputs.review_limit }}" ]; then
              echo "::error::schedule/workflow_dispatch-triggered runs must receive capacity_query, queue_query, and review_limit"
              exit 1
            fi
          fi
      # Verifies the triggering comment is the proposal's actual first/
      # control comment, not just any comment containing matching checkbox
      # text (#63). Shared here rather than duplicated in apply/reject/
      # distill/rework, since all four already depend on this job. Marks
      # the comment 👀 on success.
      - name: Verify control comment
        if: github.event_name == 'issue_comment'
        uses: rubykatzen/starcast/actions/proposal@main
        with:
          mode: check-control-comment
          repository: ${{ github.repository }}
          issue_number: ${{ inputs.issue_number }}
          comment_id: ${{ inputs.comment_id }}
          github_token: ${{ secrets.token }}

  apply:
    needs: validate
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '[x] Apply')
    runs-on: ubuntu-latest
    concurrency:
      group: proposal-comment-${{ inputs.comment_id }}
      cancel-in-progress: false
    steps:
      - name: Apply proposal
        id: apply
        uses: rubykatzen/starcast/actions/proposal@main
        with:
          mode: apply
          repository: ${{ github.repository }}
          issue_number: ${{ inputs.issue_number }}
          prefix: ${{ inputs.prefix }}
          proposal_type_name: ${{ inputs.proposal_type_name }}
          entity_query: ${{ inputs.entity_query }}
          apply_transition_mutation: ${{ inputs.apply_transition_mutation }}
          github_token: ${{ secrets.token }}
      - name: Report to Telegram
        if: always()
        uses: rubykatzen/starcast/actions/telegram-notify@v0.6
        with:
          chat_id: ${{ inputs.telegram_chat_id }}
          bot_token: ${{ secrets.telegram_bot_token }}
          workflow: Proposal
          job: apply
          action: Apply
          status: ${{ job.status }}
          details: ${{ steps.apply.outputs.summary }}

  reject:
    needs: validate
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '[x] Reject')
    runs-on: ubuntu-latest
    concurrency:
      group: proposal-comment-${{ inputs.comment_id }}
      cancel-in-progress: false
    steps:
      - name: Reject proposal
        id: reject
        uses: rubykatzen/starcast/actions/proposal@main
        with:
          mode: reject
          repository: ${{ github.repository }}
          issue_number: ${{ inputs.issue_number }}
          github_token: ${{ secrets.token }}
      - name: Report to Telegram
        if: always()
        uses: rubykatzen/starcast/actions/telegram-notify@v0.6
        with:
          chat_id: ${{ inputs.telegram_chat_id }}
          bot_token: ${{ secrets.telegram_bot_token }}
          workflow: Proposal
          job: reject
          action: Reject
          status: ${{ job.status }}
          details: ${{ steps.reject.outputs.summary }}

  distill:
    needs: validate
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '[x] Distill')
    runs-on: ubuntu-latest
    concurrency:
      group: proposal-comment-${{ inputs.comment_id }}
      cancel-in-progress: false
    steps:
      # Agent: diff proposed vs. human-edited values, propose a
      # regulations change. Not implemented yet — tracked in #11/#13.
      - name: Distill proposal (not yet implemented)
        shell: bash
        run: 'echo "::notice::distill is not implemented yet (see #11, #13)"'
      - name: Report to Telegram
        if: always()
        uses: rubykatzen/starcast/actions/telegram-notify@v0.6
        with:
          chat_id: ${{ inputs.telegram_chat_id }}
          bot_token: ${{ secrets.telegram_bot_token }}
          workflow: Proposal
          job: distill
          action: Distill
          status: ${{ job.status }}

  rework:
    needs: validate
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '[x] Rework')
    runs-on: ubuntu-latest
    concurrency:
      group: proposal-comment-${{ inputs.comment_id }}
      cancel-in-progress: false
    steps:
      # Agent: read comment feedback and revise the proposal's fields.
      # Not implemented yet — tracked in #11.
      - name: Rework proposal (not yet implemented)
        shell: bash
        run: 'echo "::notice::rework is not implemented yet (see #11)"'
      - name: Report to Telegram
        if: always()
        uses: rubykatzen/starcast/actions/telegram-notify@v0.6
        with:
          chat_id: ${{ inputs.telegram_chat_id }}
          bot_token: ${{ secrets.telegram_bot_token }}
          workflow: Proposal
          job: rework
          action: Rework
          status: ${{ job.status }}

  propose:
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: proposal-propose-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Dequeue next proposal candidate
        id: dequeue
        uses: rubykatzen/starcast/actions/proposal@main
        with:
          mode: dequeue
          capacity_query: ${{ inputs.capacity_query }}
          queue_query: ${{ inputs.queue_query }}
          review_limit: ${{ inputs.review_limit }}
          github_token: ${{ secrets.token }}
      # Field values are mocked, not agent-decided yet — tracked in #11.
      - name: Create proposal
        id: propose
        if: steps.dequeue.outputs.result == 'dequeued'
        uses: rubykatzen/starcast/actions/proposal@main
        with:
          mode: propose
          parent_issue_id: ${{ steps.dequeue.outputs.issue_id }}
          prefix: ${{ inputs.prefix }}
          proposal_type_name: ${{ inputs.proposal_type_name }}
          entity_query: ${{ inputs.entity_query }}
          propose_transition_mutation: ${{ inputs.propose_transition_mutation }}
          github_token: ${{ secrets.token }}
      - name: Report to Telegram
        if: always()
        uses: rubykatzen/starcast/actions/telegram-notify@v0.6
        with:
          chat_id: ${{ inputs.telegram_chat_id }}
          bot_token: ${{ secrets.telegram_bot_token }}
          workflow: Proposal
          job: propose
          action: Propose
          status: ${{ job.status }}
          details: ${{ steps.propose.outputs.summary || steps.dequeue.outputs.summary }}
