name: Proposal (dogfood)
on:
  issue_comment:
    types: [edited]
  workflow_dispatch:
jobs:
  # capacity/queue are sourced from the "Proposal" Project
  # (https://github.com/orgs/rubykatzen/projects/1), not this repo's issue
  # list: queue_query only ever finds issues explicitly added to that
  # Project's Incoming column, which fully isolates what this dogfood
  # caller can touch. entity_query/the two transition mutations move an
  # item between the Project's Incoming/Review/Done columns as it moves
  # through the lifecycle (#69). Moving an item to Done also auto-closes
  # its issue -- that's a GitHub Projects built-in workflow bound to the
  # column, not something this repo's code does, and it's left as-is
  # deliberately since "applied" and "closed" line up here.
  #
  # secrets.GITHUB_TOKEN cannot mutate Projects V2 (no such permission
  # scope exists for the auto-provisioned token) -- this caller needs a
  # real PAT with organization Projects read/write, stored as
  # PROJECTS_TOKEN.
  handle:
    uses: ./.github/workflows/proposal-shared.yml
    with:
      regulations_repo: rubykatzen/starcast
      regulations_path: TRANSLATE.md
      issue_number: ${{ github.event.issue.number }}
      comment_id: ${{ github.event.comment.id }}
      capacity_query: >-
        query { organization(login: "rubykatzen") { projectV2(number: 1) { items(query: "status:Review") { capacity: totalCount } } } }
      queue_query: >-
        query { organization(login: "rubykatzen") { projectV2(number: 1) { items(first: 5, query: "status:Incoming") { queue: nodes { content { ... on Issue { id } } } } } } }
      review_limit: 1
      entity_query: >-
        query($issueId: ID!) { node(id: $issueId) { ... on Issue { projectItems(first: 10) { nodes { entity: id } } } } }
      propose_transition_mutation: >-
        mutation($entityId: ID!) { updateProjectV2ItemFieldValue(input: {projectId: "PVT_kwDOD5LpBM4Bfjz_", itemId: $entityId, fieldId: "PVTSSF_lADOD5LpBM4Bfjz_zhZ13FI", value: {singleSelectOptionId: "47fc9ee4"}}) { clientMutationId } }
      apply_transition_mutation: >-
        mutation($entityId: ID!) { updateProjectV2ItemFieldValue(input: {projectId: "PVT_kwDOD5LpBM4Bfjz_", itemId: $entityId, fieldId: "PVTSSF_lADOD5LpBM4Bfjz_zhZ13FI", value: {singleSelectOptionId: "98236657"}}) { clientMutationId } }
    secrets:
      token: ${{ secrets.PROJECTS_TOKEN }}
