name: 'Apply Proposal'
description: 'Copy a proposal Issue''s mapped fields onto its parent and close the proposal and its siblings, idempotently'
inputs:
  repository:
    description: 'owner/repo the proposal issue lives in (e.g. github.repository)'
    required: true
  issue_number:
    description: 'Number of the proposal issue to apply'
    required: true
  prefix:
    description: 'Prefix stripped from a proposal field name to find the same-named field on the parent issue'
    required: false
    default: 'Proposal '
  proposal_type_name:
    description: 'Issue Type used to identify sibling proposals of the same parent'
    required: false
    default: 'Proposal'
  github_token:
    description: 'Token with write access to issues, sub-issues, Issue Fields, and Issue Types on the parent and proposal repositories'
    required: true
outputs:
  result:
    description: '"applied" or "no-op"'
    value: ${{ steps.apply.outputs.result }}
  summary:
    description: 'Human-readable summary of what was applied and closed'
    value: ${{ steps.apply.outputs.summary }}
runs:
  using: composite
  steps:
    - id: apply
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPOSITORY: ${{ inputs.repository }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        PREFIX: ${{ inputs.prefix }}
        PROPOSAL_TYPE_NAME: ${{ inputs.proposal_type_name }}
      run: python3 "$GITHUB_ACTION_PATH/apply_proposal.py"
