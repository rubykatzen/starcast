name: 'Reject Proposal'
description: 'Close a proposal Issue, idempotently — nothing else'
inputs:
  repository:
    description: 'owner/repo the proposal issue lives in (e.g. github.repository)'
    required: true
  issue_number:
    description: 'Number of the proposal issue to reject'
    required: true
  github_token:
    description: 'Token with write access to issues in the proposal repository'
    required: true
outputs:
  result:
    description: '"rejected" or "no-op"'
    value: ${{ steps.reject.outputs.result }}
  summary:
    description: 'Human-readable summary of the outcome'
    value: ${{ steps.reject.outputs.summary }}
runs:
  using: composite
  steps:
    - id: reject
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPOSITORY: ${{ inputs.repository }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
      run: python3 "$GITHUB_ACTION_PATH/reject_proposal.py"
