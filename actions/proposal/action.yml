name: 'Proposal'
description: 'Unified CLI for the proposal lifecycle: dequeue, list-fields, propose, apply, reject (#11, #55)'
inputs:
  mode:
    description: '"dequeue", "list-fields", "propose", "apply", "reject", or "check-control-comment"'
    required: true
  repository:
    description: '"owner/repo" (list-fields, apply, reject, check-control-comment)'
    required: false
  issue_number:
    description: 'Proposal issue number (apply, reject, check-control-comment)'
    required: false
  comment_id:
    description: 'Id of the comment to verify is the proposal''s first/control comment (check-control-comment; see #63)'
    required: false
  parent_issue_id:
    description: 'GraphQL node id of the issue to propose against (propose, propose-context)'
    required: false
  regulations_repo:
    description: '"owner/repo" that owns the regulations document (propose-context)'
    required: false
  regulations_path:
    description: 'Path to the regulations document inside regulations_repo, read from its default branch (propose-context)'
    required: false
  model_response:
    description: 'JSON {"title", "body", "fields": {...}} decided by a model from propose-context''s prompt (propose)'
    required: false
  capacity_query:
    description: 'GraphQL query text; must alias exactly one scalar numeric field as `capacity` (dequeue)'
    required: false
  queue_query:
    description: 'GraphQL query text; must alias exactly one array-valued field as `queue` (dequeue)'
    required: false
  review_limit:
    description: 'Maximum number of issues allowed in review at once (dequeue)'
    required: false
  prefix:
    description: 'Prefix stripped from a proposal field name to find the same-named field on the parent (list-fields, propose, apply)'
    required: false
    default: 'Proposal '
  proposal_type_name:
    description: 'Issue Type a proposal is created with / identified by (propose, apply)'
    required: false
    default: 'Proposal'
  entity_query:
    description: 'GraphQL query text; must alias exactly one scalar field as `entity` (e.g. a ProjectV2Item id). Optional -- omit if the transition mutation needs no entity id (propose, apply; see #69)'
    required: false
  propose_transition_mutation:
    description: 'GraphQL mutation text run after a proposal is created, receiving $issueId/$entityId. Optional -- omit for no transition step (propose; see #69)'
    required: false
  apply_transition_mutation:
    description: 'GraphQL mutation text run after Apply succeeds, receiving $issueId/$entityId (issueId is the parent). Optional -- omit for no transition step (apply; see #69)'
    required: false
  github_token:
    description: 'Token with write access to issues, sub-issues, Issue Fields, and Issue Types on the relevant repositories'
    required: true
outputs:
  result:
    description: 'Outcome; meaning depends on mode (e.g. "dequeued"/"no-op-at-capacity" for dequeue, "applied"/"no-op" for apply)'
    value: ${{ steps.run.outputs.result }}
  issue_id:
    description: 'GraphQL node id relevant to the outcome, when applicable'
    value: ${{ steps.run.outputs.issue_id }}
  fields:
    description: 'JSON field catalog (list-fields only)'
    value: ${{ steps.run.outputs.fields }}
  prompt:
    description: 'Self-contained prompt for a model to decide proposal content (propose-context only)'
    value: ${{ steps.run.outputs.prompt }}
  summary:
    description: 'Human-readable summary of the outcome'
    value: ${{ steps.run.outputs.summary }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        MODE: ${{ inputs.mode }}
        REPOSITORY: ${{ inputs.repository }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        COMMENT_ID: ${{ inputs.comment_id }}
        PARENT_ISSUE_ID: ${{ inputs.parent_issue_id }}
        REGULATIONS_REPO: ${{ inputs.regulations_repo }}
        REGULATIONS_PATH: ${{ inputs.regulations_path }}
        MODEL_RESPONSE: ${{ inputs.model_response }}
        CAPACITY_QUERY: ${{ inputs.capacity_query }}
        QUEUE_QUERY: ${{ inputs.queue_query }}
        REVIEW_LIMIT: ${{ inputs.review_limit }}
        PREFIX: ${{ inputs.prefix }}
        PROPOSAL_TYPE_NAME: ${{ inputs.proposal_type_name }}
        ENTITY_QUERY: ${{ inputs.entity_query }}
        PROPOSE_TRANSITION_MUTATION: ${{ inputs.propose_transition_mutation }}
        APPLY_TRANSITION_MUTATION: ${{ inputs.apply_transition_mutation }}
      run: |
        args=("$MODE")
        case "$MODE" in
          dequeue)
            args+=(--capacity-query "$CAPACITY_QUERY" --queue-query "$QUEUE_QUERY" --review-limit "$REVIEW_LIMIT")
            ;;
          list-fields)
            args+=(--repository "$REPOSITORY" --prefix "$PREFIX")
            ;;
          propose-context)
            args+=(--parent-issue-id "$PARENT_ISSUE_ID" --regulations-repo "$REGULATIONS_REPO" --regulations-path "$REGULATIONS_PATH" --prefix "$PREFIX")
            ;;
          propose)
            args+=(--parent-issue-id "$PARENT_ISSUE_ID" --prefix "$PREFIX" --type "$PROPOSAL_TYPE_NAME" --model-response "$MODEL_RESPONSE" --entity-query "$ENTITY_QUERY" --transition-mutation "$PROPOSE_TRANSITION_MUTATION")
            ;;
          apply)
            args+=(--repository "$REPOSITORY" --issue-number "$ISSUE_NUMBER" --prefix "$PREFIX" --type "$PROPOSAL_TYPE_NAME" --entity-query "$ENTITY_QUERY" --transition-mutation "$APPLY_TRANSITION_MUTATION")
            ;;
          reject)
            args+=(--repository "$REPOSITORY" --issue-number "$ISSUE_NUMBER")
            ;;
          check-control-comment)
            args+=(--repository "$REPOSITORY" --issue-number "$ISSUE_NUMBER" --comment-id "$COMMENT_ID")
            ;;
          *)
            echo "::error::unknown mode '$MODE'"
            exit 1
            ;;
        esac
        python3 "$GITHUB_ACTION_PATH/proposal.py" "${args[@]}"
